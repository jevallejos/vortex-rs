[package]
name = "vortex-rs"
version = "1.0.0"
edition = "2021"
description = "VORTEX-L2 — Institutional Low-Latency Execution Core (VORTEX-RS-V1.0)"
license = "Proprietary"

[lib]
name = "vortex_rs"
path = "src/lib.rs"

[[bin]]
name = "vortex_tap"
path = "src/bin/vortex_tap.rs"

[[bin]]
name = "vortex_replay"
path = "src/bin/vortex_replay.rs"

[[bin]]
name = "vortex_exec"
path = "src/bin/vortex_exec.rs"

[dependencies]
serde_json = "1.0"
tungstenite = { version = "0.21", features = ["native-tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
float_cmp = "deny"